<router-outlet />

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ title | uppercase }}</mat-card-title>
    <mat-card-subtitle>{{ subtitle | lowercase}}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
  <app-home></app-home>
  <span>{{ todayDate | date:'dd/MM/yy' }}</span>
  <br>
  <span>{{ salary | currency:'EUR' }}</span>
  <br>
  <span>{{ salary | number:'1.3-3' }}</span>
  <br>
  <span>{{ salary/100 | percent }}</span>
  <br>
  <span>{{ _object | json }}</span>
  <br>
  <span>{{ title | reverse }}</span>
  <br>
  <input type="checkbox" [checked]="isdisabled">
  <input type="checkbox" checked={{isdisabled}}>
  <br>
  <input value={{isdisabled}}>
  <br>
  <span>{{ isdisabled}}</span>
  </mat-card-content>
  <mat-card-actions>
  </mat-card-actions>
</mat-card>
<br>
